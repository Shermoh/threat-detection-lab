name: Offline detection tests

on:
  push:
    paths:
      - "detections/**"
      - "sample-data/**"
      - "tests/**"
      - "case-studies/**"
      - "tools/ir001_timeline.py"
      - "tools/ir001_task_followup.py"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "detections/**"
      - "sample-data/**"
      - "tests/**"
      - "case-studies/**"
      - "tools/ir001_timeline.py"
      - "tools/ir001_task_followup.py"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  offline-fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Sigma parser for rule tests
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline fixture tests
        run: python -m unittest discover -s tests -v
