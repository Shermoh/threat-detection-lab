name: Sigma-to-KQL backend conversion

on:
  push:
    paths:
      - "detections/sigma/**"
      - "detections/kql/generated/**"
      - "tests/kql/sigma_conversion_validation.kql"
      - "tests/test_sigma_conversion.py"
      - "tools/convert_sigma_to_kql.py"
      - ".github/workflows/sigma-conversion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Kusto conversion backend
        run: |
          python -m pip install "pysigma==1.5.1" "pysigma-backend-kusto==1.0.1"
      - name: Generate KQL via actual pySigma backend
        run: python tools/convert_sigma_to_kql.py
      - name: Verify generated KQL snapshots and 4688 scoping
        run: python -m unittest discover -s tests -p test_sigma_conversion.py -v
